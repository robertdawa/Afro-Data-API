# Entry point so `docker compose up` works from the repo root.
# The service definitions live in infra/docker-compose.yml (see SPEC.md §11).
# project_directory: . makes paths in that file resolve from the repo root
# and makes Compose read the root .env for variable interpolation.
name: adp

include:
  - path: infra/docker-compose.yml
    project_directory: .
