name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://adp:adp@localhost:5432/adp
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_RAW: adp-raw
      S3_BUCKET_EXPORTS: adp-exports
    steps:
      - uses: actions/checkout@v4

      # MinIO needs a `server` command, which service containers can't pass.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            docker exec minio mc ready local && break
            sleep 2
          done
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb --ignore-existing local/adp-raw local/adp-exports

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      - name: Pytest
        run: pytest --cov --cov-report=term --cov-report=xml

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Build (includes type check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: docker compose config --quiet
